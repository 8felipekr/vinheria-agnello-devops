services:
  dns-dhcp-server:
    build: ./infra/dns-dhcp
    container_name: vinheria-dns-dhcp
    hostname: dns.vinheria.local
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      vinheria-net:
        ipv4_address: 172.28.0.53
    restart: unless-stopped

  quality-iot-service:
    build: ./services/quality-iot-service
    container_name: vinheria-quality-iot
    hostname: quality.vinheria.local
    depends_on:
      - dns-dhcp-server
    dns:
      - 172.28.0.53
    dns_search:
      - vinheria.local
    volumes:
      - ./certs:/certs:ro
      - quality-data:/data
    environment:
      - JWT_PRIVATE_KEY_PATH=/certs/jwt_private.pem
      - JWT_PUBLIC_KEY_PATH=/certs/jwt_public.pem
      - VINHERIA_CA_CERT=/certs/ca.crt
      - NOTIFICATION_HTTP_URL=http://notification.vinheria.local:5002/api/v1/alerts
      - NOTIFICATION_HTTPS_URL=https://notification.vinheria.local:5444/api/v1/alerts
    networks:
      vinheria-net:
        ipv4_address: 172.28.0.20
    restart: unless-stopped

  notification-service:
    build: ./services/notification-service
    container_name: vinheria-notification
    hostname: notification.vinheria.local
    depends_on:
      - dns-dhcp-server
    dns:
      - 172.28.0.53
    dns_search:
      - vinheria.local
    volumes:
      - ./certs:/certs:ro
      - notification-data:/data
    environment:
      - JWT_PUBLIC_KEY_PATH=/certs/jwt_public.pem
    networks:
      vinheria-net:
        ipv4_address: 172.28.0.30
    restart: unless-stopped

  api-gateway:
    image: nginx:1.27-alpine
    container_name: vinheria-api-gateway
    hostname: gateway.vinheria.local
    depends_on:
      - dns-dhcp-server
      - quality-iot-service
      - notification-service
    dns:
      - 172.28.0.53
    dns_search:
      - vinheria.local
    ports:
      - "8081:80"
      - "8443:443"
    volumes:
      - ./infra/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/certs:ro
    networks:
      vinheria-net:
        ipv4_address: 172.28.0.10
    restart: unless-stopped

  esp32-sensor-01:
    build: ./infra/esp32-sim
    container_name: vinheria-esp32-sensor
    hostname: esp32-sensor-01
    cap_add:
      - NET_ADMIN
      - NET_RAW
    depends_on:
      - dns-dhcp-server
      - api-gateway
    dns:
      - 172.28.0.53
    dns_search:
      - vinheria.local
    volumes:
      - ./certs:/certs:ro
    networks:
      - vinheria-net
    restart: unless-stopped

  prod-publish-site:
    image: nginx:1.27-alpine
    container_name: vinheria-prod-site
    hostname: prod-site.vinheria.local
    depends_on:
      - dns-dhcp-server
    dns:
      - 172.28.0.53
    dns_search:
      - vinheria.local
    ports:
      - "8088:80"
    volumes:
      - ./infra/prod-site/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/wwwroot:/var/www/vinheria-agnello:ro
    networks:
      vinheria-net:
        ipv4_address: 172.28.0.50
    restart: unless-stopped

  jenkins-ci:
    build: ./infra/jenkins
    container_name: vinheria-jenkins
    hostname: jenkins.vinheria.local
    depends_on:
      - dns-dhcp-server
      - prod-publish-site
      - api-gateway
    dns:
      - 172.28.0.53
    dns_search:
      - vinheria.local
    ports:
      - "8080:8080"
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false -Dhudson.plugins.git.GitSCM.ALLOW_LOCAL_CHECKOUT=true
    volumes:
      - jenkins-home:/var/jenkins_home
      - .:/var/git/vinheria-agnello:ro
      - ./deploy/wwwroot:/var/www/vinheria-agnello
      - ./certs:/certs:ro
    networks:
      vinheria-net:
        ipv4_address: 172.28.0.40
    restart: unless-stopped

volumes:
  quality-data:
  notification-data:
  jenkins-home:

networks:
  vinheria-net:
    name: vinheria-net
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-vinheria
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/24
          ip_range: 172.28.0.64/27
          gateway: 172.28.0.1
