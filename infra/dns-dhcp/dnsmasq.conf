# Servidor DNS Autoritativo + DHCP - Vinheria Agnello (vinheria.local)
interface=eth0
bind-interfaces

# --- DNS ---
domain-needed
bogus-priv
no-resolv
no-hosts
addn-hosts=/etc/hosts.vinheria
domain=vinheria.local
local=/vinheria.local/
expand-hosts
server=127.0.0.11
log-queries

# --- DHCP ---
dhcp-authoritative
dhcp-range=172.28.0.100,172.28.0.150,255.255.255.0,12h
dhcp-option=option:router,172.28.0.1
dhcp-option=option:dns-server,172.28.0.53
dhcp-option=option:domain-name,vinheria.local
dhcp-leasefile=/var/lib/misc/dnsmasq.leases
log-dhcp
