worker_processes auto;
events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/json;
    sendfile on;

    resolver 172.28.0.53 valid=10s ipv6=off;

    log_format vinheria '$remote_addr - [$time_local] "$request" $status '
                        'scheme=$scheme upstream=$upstream_addr tls=$ssl_protocol';
    access_log /var/log/nginx/access.log vinheria;
    error_log  /var/log/nginx/error.log warn;

    # =========================================================================
    # PORTA 80 - HTTP INSEGURO (Apenas para demonstracao Wireshark sem TLS)
    # =========================================================================
    server {
        listen 80;
        server_name gateway.vinheria.local localhost;

        add_header X-Security-Mode "INSECURE-HTTP-PLAINTEXT" always;

        location = /health {
            return 200 '{"gateway":"vinheria-api-gateway","mode":"INSECURE_HTTP","tls":false}\n';
        }

        location /api/v1/auth/ {
            set $quality_http http://quality.vinheria.local:5001;
            proxy_pass $quality_http;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Transport-Mode "insecure";
        }

        location /.well-known/ {
            set $quality_http http://quality.vinheria.local:5001;
            proxy_pass $quality_http;
            proxy_set_header Host $host;
        }

        location /api/v1/telemetry {
            set $quality_http http://quality.vinheria.local:5001;
            proxy_pass $quality_http;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Transport-Mode "insecure";
        }

        location /api/v1/alerts {
            set $notif_http http://notification.vinheria.local:5002;
            proxy_pass $notif_http;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Transport-Mode "insecure";
        }
    }

    # =========================================================================
    # PORTA 443 - HTTPS SEGURO (TLS 1.2 / TLS 1.3 + Backends HTTPS)
    # =========================================================================
    server {
        listen 443 ssl;
        server_name gateway.vinheria.local localhost;

        ssl_certificate     /certs/gateway.crt;
        ssl_certificate_key /certs/gateway.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Security-Mode "SECURE-HTTPS-TLS" always;

        location = /health {
            return 200 '{"gateway":"vinheria-api-gateway","mode":"SECURE_HTTPS","tls":true}\n';
        }

        location /api/v1/auth/ {
            set $quality_https https://quality.vinheria.local:5443;
            proxy_pass $quality_https;
            proxy_ssl_trusted_certificate /certs/ca.crt;
            proxy_ssl_verify on;
            proxy_ssl_name quality.vinheria.local;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Transport-Mode "secure";
        }

        location /.well-known/ {
            set $quality_https https://quality.vinheria.local:5443;
            proxy_pass $quality_https;
            proxy_ssl_trusted_certificate /certs/ca.crt;
            proxy_ssl_verify on;
            proxy_ssl_name quality.vinheria.local;
            proxy_set_header Host $host;
        }

        location /api/v1/telemetry {
            set $quality_https https://quality.vinheria.local:5443;
            proxy_pass $quality_https;
            proxy_ssl_trusted_certificate /certs/ca.crt;
            proxy_ssl_verify on;
            proxy_ssl_name quality.vinheria.local;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Transport-Mode "secure";
        }

        location /api/v1/alerts {
            set $notif_https https://notification.vinheria.local:5444;
            proxy_pass $notif_https;
            proxy_ssl_trusted_certificate /certs/ca.crt;
            proxy_ssl_verify on;
            proxy_ssl_name notification.vinheria.local;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Transport-Mode "secure";
        }
    }
}
