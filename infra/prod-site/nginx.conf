server {
    listen 80;
    server_name prod-site.vinheria.local www.vinheria.local localhost;

    root /var/www/vinheria-agnello;
    index index.html;

    add_header X-Simulated-Host "IIS-Production-Equivalent (Nginx)" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location /releases/ {
        autoindex on;
    }
}
